name: Documentation

# Builds the Fumadocs site in `docs/` and publishes it to GitHub Pages.
#
# One-time setup: in the repository, go to Settings → Pages and set
# "Build and deployment → Source" to "GitHub Actions". Without that, the
# deploy job fails with a "Pages site not found" error.

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '.github/workflows/docs.yml'
  # Allows a manual run from the Actions tab.
  workflow_dispatch:

permissions:
  contents: read

# Never let two deployments race. In-progress runs finish rather than being
# cancelled, so a half-published site is never left behind.
concurrency:
  group: github-pages
  cancel-in-progress: false

defaults:
  run:
    working-directory: docs

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: docs/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Resolve the Pages base path
        id: base
        # A project site is served from https://<owner>.github.io/<repo>/, so it
        # needs a base path. A user or organisation site is served from the
        # domain root and must not have one.
        run: |
          repo='${{ github.event.repository.name }}'
          owner=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')
          if [ "$(echo "$repo" | tr '[:upper:]' '[:lower:]')" = "$owner.github.io" ]; then
            echo "path=" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo" >> "$GITHUB_OUTPUT"
          fi

      - name: Build the static site
        env:
          GITHUB_PAGES: 'true'
          NEXT_PUBLIC_BASE_PATH: ${{ steps.base.outputs.path }}
        run: npm run build

      - name: Upload the Pages artifact
        # Only the branch that gets deployed needs to hand off an artifact;
        # pull requests stop at the build, which is what we want them to prove.
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3
        with:
          path: docs/out

  deploy:
    name: Deploy
    # Pull requests build but never publish.
    if: github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
